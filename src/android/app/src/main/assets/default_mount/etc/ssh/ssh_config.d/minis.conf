# Mines defaults for ssh from the phone sandbox (mobile networks drop idle
# TCP and change address often). Override per host in ~/.ssh/config.
Host *
    # [38.9] 15 s keepalive x 4 = a drop is declared only after ~60 s of silence
    ServerAliveInterval 15
    ServerAliveCountMax 4
    TCPKeepAlive yes
    ConnectTimeout 12
    ConnectionAttempts 2
    StrictHostKeyChecking accept-new
    IPQoS none
    # Key Mines installs on first password login (canonical copy is encrypted
    # in the app), then the one `minis-vps setup` makes; standard keys after.
    IdentityFile ~/.ssh/minis_vps_app_key
    IdentityFile ~/.ssh/minis_vps_ed25519
    IdentityFile ~/.ssh/id_ed25519
    IdentityFile ~/.ssh/id_rsa
