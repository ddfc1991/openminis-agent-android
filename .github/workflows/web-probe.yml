name: Web AI page probe (real sites, mobile Chrome)
on:
  push:
    branches: [hark-minis-build]
    paths: ['hark-build/probe/**', '.github/workflows/web-probe.yml']
  workflow_dispatch:
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q playwright==1.48.0 && python -m playwright install --with-deps chromium >/dev/null
      - run: python hark-build/probe/probe_ci.py probe-out || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: probe-out, path: probe-out }
