name: Build Mines APK (continued development of OpenMinis)

on:
  workflow_dispatch:
  push:
    branches: [build-i]
    paths-ignore:
      - 'hark-build/smoke/**'
      - '.github/workflows/vps-smoke.yml'
      - 'hark-build/probe/**'
      - '.github/workflows/web-probe.yml'
      - '.github/workflows/mines-release-387.yml'
      - '.github/workflows/mines-release-388.yml'
      - 'hark-build/release/**'

env:
  UPSTREAM: https://github.com/OpenMinis/OpenMinis
  UPSTREAM_REF: b4c0661          # the commit the patches were written and compiled against
  NDK_R28: 28.0.12433566
  NDK_AGP: 27.0.12077973         # the version Gradle asks for at configure time
  MINES_PACKAGE: com.openminis.mines.plus
  # SHA-256 of the fixed Mines signing cert (hark-build/mines-debug.keystore).
  MINES_CERT_SHA256: 001814fb258110b003c851aeeac930fd3d803224eb9acdcab0a383edcb740e2b

permissions:
  contents: write

# Queue builds instead of running them side by side; a newer push replaces a
# queued (not a running) one.
concurrency:
  group: mines-build-i
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Fetch OpenMinis at the pinned commit
        run: |
          git clone "$UPSTREAM" om
          cd om
          git checkout "$UPSTREAM_REF"
          git submodule update --init deps/proot

      - name: Apply patches
        run: |
          cd om
          for p in ../hark-build/patches/minis-app-*.patch; do echo "applying $p"; git apply --whitespace=nowarn "$p"; done
          (cd deps/proot && git apply --whitespace=nowarn ../../../hark-build/patches/proot-real-ifaces.patch)
          git -C . status --short

      - name: DSH plugin self-test (same path as the app; blocks the build)
        # [Mines-dsh-25] Runs `minis-dsh selftest`: installs dsh-workbuddy-connect
        # and dsh-whale-widget with `minis-dsh add`, runs `minis-dsh list` (what
        # 检查 runs) against a stale status plus a plugin that leaves a child
        # process, checks status.json the way Mines reads it, starts
        # `minis-dsh web` (what 显示挂件 starts) and loads the page in headless
        # Chrome to prove the widget starts. One retry for npm network flakes.
        run: |
          B=om/src/android/app/src/main/assets/default_mount/usr/local
          for i in 1 2; do
            MINIS_DSH_SOCK="$PWD/$B/lib/minis-dsh/socket.mjs" timeout 600 sh "$B/bin/minis-dsh" selftest > dsh-selftest.txt 2>&1 && { cat dsh-selftest.txt; exit 0; }
            cat dsh-selftest.txt; echo "::warning::DSH self-test attempt $i failed"
          done
          echo "::error::DSH self-test failed"; exit 1

      - name: Market git+ssh GitHub dependency installs over HTTPS (38.9.7; blocks the build)
        # [Mines-38.9.7] phone 「安装 rea 没有权限」: npm ran git ls-remote ssh://git@github.com/… → publickey. The runner,
        # like the phone sandbox, has no GitHub SSH key. Install a package whose dependency is a git+ssh GitHub url with the
        # exact git env the app ships (MarketGitCore.GIT_ENV = minis-dsh git_https = profile.d), then check the HTTPS spec rewrite.
        run: |
          A=om/src/android/app/src/main
          K=$A/java/com/openminis/app/plus/MarketGitCore.kt
          grep -q '"GIT_CONFIG_VALUE_0" to "ssh://git@github.com/"' $K && grep -q '"GIT_CONFIG_VALUE_1" to "git@github.com:"' $K || { echo "::error::MarketGitCore.GIT_ENV changed"; exit 1; }
          grep -q 'GIT_CONFIG_VALUE_0=ssh://git@github.com/' $A/assets/default_mount/usr/local/bin/minis-dsh || { echo "::error::minis-dsh git_https missing"; exit 1; }
          grep -q 'insteadOf "git@github.com:"' $A/assets/default_mount/etc/profile.d/minis.sh || { echo "::error::profile.d git config missing"; exit 1; }
          grep -q 'MarketGitCore.GIT_ENV' $A/java/com/openminis/app/sandbox/PRootKernel.kt || { echo "::error::PRootKernel git env missing"; exit 1; }
          rm -rf ~/.ssh; mkdir -p /tmp/gitdep && cd /tmp/gitdep
          printf '{"name":"mines-gitdep-test","version":"1.0.0","private":true,"dependencies":{"abbrev":"git+ssh://git@github.com/npm/abbrev-js.git"}}\n' > package.json
          export GIT_TERMINAL_PROMPT=0 GIT_CONFIG_COUNT=2 \
            GIT_CONFIG_KEY_0=url.https://github.com/.insteadOf GIT_CONFIG_VALUE_0=ssh://git@github.com/ \
            GIT_CONFIG_KEY_1=url.https://github.com/.insteadOf GIT_CONFIG_VALUE_1=git@github.com:
          ok=0; for i in 1 2; do timeout 300 npm install --no-audit --no-fund --ignore-scripts > npm.txt 2>&1 && { ok=1; break; }; cat npm.txt; done
          cat npm.txt; [ $ok = 1 ] || { echo "::error::git+ssh dependency did not install over HTTPS"; exit 1; }
          [ -f node_modules/abbrev/package.json ] || { echo "::error::abbrev missing after install"; exit 1; }
          if grep -qi 'publickey' npm.txt; then echo "::error::npm still tried SSH"; exit 1; fi
          echo "git+ssh dep OK: $(node -p "require('./node_modules/abbrev/package.json').version")"

      - name: 免登录 entries answer (38.9.8; a dead shipped free entry fails the build)
        # [Mines-38.9.8] user 2026-10-19 「这些免登陆的，用不了啊」: every anonymous public gateway listed in
        # assets/mines/free_public_routes.tsv is called live (models list + one tiny chat). Any anonymous-gateway marker in
        # the code that is NOT listed there also fails (nothing ships untested).
        run: |
          A=om/src/android/app/src/main
          T=$A/assets/mines/free_public_routes.tsv
          [ -f "$T" ] || { echo "::error::free_public_routes.tsv missing"; exit 1; }
          hits=$(grep -rlE "Bearer public|opencode\.ai/zen/v1|api\.kilo\.ai/api/openrouter|kilocode\.ai/api/openrouter" $A/java $A/assets --include=*.kt --include=*.json --include=*.tsv --include=*.sh 2>/dev/null | grep -v free_public_routes.tsv | grep -v 'OpenCodeSessionHeader.kt' | grep -v 'models-dev-api.json' || true)
          if [ -n "$hits" ]; then echo "::error::anonymous gateway in code but not live-tested via free_public_routes.tsv: $hits"; exit 1; fi
          n=0; dead=0
          while IFS=$'\t' read -r name base model auth; do
            case "$name" in ''|'#'*) continue;; esac
            n=$((n+1)); H=(); [ "$auth" != "-" ] && H=(-H "Authorization: $auth")
            mc=$(curl -sS -m 30 -o /tmp/m.json -w '%{http_code}' "${H[@]}" "$base/models" || echo 000)
            cc=$(curl -sS -m 60 -o /tmp/c.json -w '%{http_code}' "${H[@]}" -H 'Content-Type: application/json' \
              -d "{\"model\":\"$model\",\"messages\":[{\"role\":\"user\",\"content\":\"Reply OK\"}],\"max_tokens\":16}" "$base/chat/completions" || echo 000)
            txt=$(python3 -c "import json;d=json.load(open('/tmp/c.json'));print((d.get('choices') or [{}])[0].get('message',{}).get('content') or '')" 2>/dev/null || true)
            if [ "$cc" = 200 ] && [ -n "$txt" ]; then echo "LIVE  $name ($model): models $mc, chat 200"; else dead=$((dead+1)); echo "::error::DEAD $name ($model): models $mc, chat $cc $(head -c 200 /tmp/c.json)"; fi
          done < "$T"
          echo "free entries checked: $n, dead: $dead"
          [ $dead = 0 ] || exit 1

      - name: Overlay window audit (no leftover / touch-eating floating windows)
        # [Mines-pet-26] Every floating window must go through plus/Overlays.kt, which forces
        # NOT_TOUCHABLE on windows that show nothing and tracks them for cleanup.
        run: |
          cd om/src/android/app/src/main/java/com/openminis/app
          if grep -rnE '(manager|wm|windowManager)\??\.addView\(' --include=*.kt plus ui | grep -v 'plus/Overlays.kt'; then
            echo "::error::floating window added without Overlays.add"; exit 1; fi
          grep -q 'Overlays.removeAll("dsh-widget")' plus/DshWidgets.kt || { echo "::error::widget overlay cleanup missing"; exit 1; }
          grep -q 'Overlays.removeAll(it)' plus/DeskPetService.kt || { echo "::error::pet overlay cleanup missing"; exit 1; }
          echo "overlay audit ok"
          # [Mines-brand-26] settings rows: single-colour line icons, no coloured badge
          if grep -n 'color = iconColor' ui/settings/SettingsScreen.kt; then echo "::error::coloured icon badge is back in settings"; exit 1; fi
          grep -q 'object MinesIcons' ui/brand/MinesIcons.kt || { echo "::error::icon set missing"; exit 1; }

      - name: Readability audit (home cards + list timestamps)
        # [Mines-a11y-26] The user is partially sighted. Home status chips must colour their
        # text with the contrast helpers, and list timestamps must not use colorScheme.outline.
        run: |
          cd om/src/android/app/src/main/java/com/openminis/app
          grep -q 'cardTextColor(fill)' ui/plus/TodayCard.kt || { echo "::error::home chips lost cardTextColor"; exit 1; }
          if grep -nE 'Text\(value, [^)]*\)' ui/plus/TodayCard.kt | grep -v 'color = '; then echo "::error::chip value text without explicit colour"; exit 1; fi
          if grep -nB3 'color = MaterialTheme.colorScheme.outline,' ui/sessions/SessionListScreen.kt | grep -E 'timeText|dateText'; then
            echo "::error::conversation list timestamp uses the low-contrast outline colour"; exit 1; fi
          [ "$(grep -c 'readableSecondary()' ui/sessions/SessionListScreen.kt)" -ge 2 ] || { echo "::error::timestamps not using readableSecondary()"; exit 1; }
          echo "readability audit ok"

      - name: Fresh Mozilla CA bundle for the sandbox
        # [Mines-net-26] Shipped as /etc/ssl/minis-mozilla.pem; SandboxNet merges it with the
        # rootfs bundle into /etc/ssl/minis-ca.pem (SSL_CERT_FILE / REQUESTS_CA_BUNDLE / PIP_CERT).
        run: |
          d=om/src/android/app/src/main/assets/default_mount/etc/ssl
          mkdir -p "$d"
          curl -fsSL --retry 3 https://curl.se/ca/cacert.pem -o "$d/minis-mozilla.pem"
          n=$(grep -c 'BEGIN CERTIFICATE' "$d/minis-mozilla.pem"); echo "certs: $n"
          [ "$n" -gt 100 ] || { echo "::error::CA bundle download looks wrong"; exit 1; }

      - uses: docker/setup-qemu-action@v3
        with: { platforms: arm64 }

      - name: Sandbox network self-test (app rootfs + app env; blocks the build)
        # [Mines-net-26] Boots the same Alpine minirootfs the APK ships (aarch64 via qemu)
        # with the app's overlay/env/mirror logic and runs apk add gcc, pip download
        # requests, a stalled-mirror recovery, a dead-proxy run and minis-doctor.
        run: |
          ver=$(sed -n 's/^ALPINE_RELEASE="\(.*\)"/\1/p' om/scripts/prepare_android_sandbox.sh); mv=${ver%.*}
          echo "Alpine $ver"
          curl -fsSL --retry 3 -o rootfs.tgz "https://dl-cdn.alpinelinux.org/alpine/v$mv/releases/aarch64/alpine-minirootfs-$ver-aarch64.tar.gz"
          docker import --platform linux/arm64 rootfs.tgz mines-rootfs:test
          timeout 2400 docker run --rm --platform linux/arm64 \
            -v "$PWD/om/src/android/app/src/main/assets/default_mount:/mnt/dm:ro" \
            -v "$PWD/hark-build/sandbox-net-selftest.sh:/selftest.sh:ro" \
            mines-rootfs:test /bin/sh /selftest.sh 2>&1 | tee sandbox-net.txt
          grep -q SANDBOX_NET_SELFTEST_OK sandbox-net.txt || { echo "::error::sandbox network self-test failed"; exit 1; }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }

      - uses: actions/setup-go@v5
        with: { go-version: "1.25.x", cache: false }

      - name: Android NDKs
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_R28" "ndk;$NDK_AGP" "platforms;android-36" "build-tools;36.0.0" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_R28" >> "$GITHUB_ENV"

      - name: gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          "$HOME/go/bin/gomobile" init

      - name: Native deps (proot, rootfs, rclone)
        run: |
          cd om
          ./deps/build_proot.sh
          ./scripts/prepare_android_sandbox.sh
          ./deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/
          # [Mines-voiceprint-34] sherpa-onnx (speaker verification, CAM++), pinned by SHA-256
          curl -fsSL --retry 3 -o src/android/app/libs/sherpa-onnx.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-static-link-onnxruntime-1.13.8.aar
          echo "b22c3fc1b6a45666d28892bb2f7694beeb77a8362d7ebd77c1a5431ec9435471  src/android/app/libs/sherpa-onnx.aar" | sha256sum -c -
          # [Mines-voiceprint-35.3] CAM++ voiceprint model bundled in the APK (no first-use download), pinned by SHA-256
          mkdir -p src/android/app/src/main/assets/models
          curl -fsSL --retry 3 -o src/android/app/src/main/assets/models/campplus.onnx https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/3dspeaker_speech_campplus_sv_zh-cn_16k-common.onnx \
            || curl -fsSL --retry 3 -o src/android/app/src/main/assets/models/campplus.onnx https://hf-mirror.com/csukuangfj/speaker-embedding-models/resolve/main/3dspeaker_speech_campplus_sv_zh-cn_16k-common.onnx
          echo "f682b514c05d947ee3fa91cd6ec6c5c7543479a128373fa29b1faedccd21fd11  src/android/app/src/main/assets/models/campplus.onnx" | sha256sum -c -
          # [Mines-38.9.6 i14] embedded Clash core: mihomo (Clash.Meta, MetaCubeX/mihomo, GPL-3.0) v1.19.32 android-arm64,
          # pinned by SHA-256, shipped as jniLibs/arm64-v8a/libmihomo.so (an app may only exec binaries from nativeLibraryDir)
          mkdir -p src/android/app/src/main/jniLibs/arm64-v8a
          curl -fsSL --retry 3 -o /tmp/mihomo.gz https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-android-arm64-v8-v1.19.32.gz
          echo "42b1f2be8702484d3ae6238daab392622f54bd0d264966700f1f28f52596e326  /tmp/mihomo.gz" | sha256sum -c -
          gunzip -c /tmp/mihomo.gz > src/android/app/src/main/jniLibs/arm64-v8a/libmihomo.so
          ls -la src/android/app/src/main/jniLibs/arm64-v8a/

      - name: Release number
        run: |
          # hark-build/RELEASE holds the public build number (build-<n>), so
          # failed CI runs no longer burn release numbers. Falls back to the
          # run number when the file is missing.
          # 「38.1」 = point release: integer part is the build number (update checks), the full text is the label
          n=$(cut -d. -f1 < hark-build/RELEASE 2>/dev/null | tr -dc '0-9' || true)
          label=$(tr -dc '0-9.' < hark-build/RELEASE 2>/dev/null || true)
          echo "MINES_BUILD_NUMBER=${n:-${{ github.run_number }}}" >> "$GITHUB_ENV"
          echo "MINES_BUILD_LABEL=${label:-${n:-${{ github.run_number }}}}" >> "$GITHUB_ENV"

      - name: Assemble APK
        timeout-minutes: 40
        run: |
          # Fixed signing key so each new build installs over the last one.
          # build.gradle.kts reads MINES_KEYSTORE explicitly; the copy into
          # ~/.android alone was not picked up on the runner (build-12 came
          # out signed with a random key).
          export MINES_KEYSTORE="$GITHUB_WORKSPACE/hark-build/mines-debug.keystore"
          mkdir -p ~/.android && cp hark-build/mines-debug.keystore ~/.android/debug.keystore
          cd om/src/android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../../../out
          find app/build/outputs/apk -name '*.apk' -exec cp {} ../../../out/ \;
          ls -la ../../../out

      - name: Sign v1 + v2 + v3 with the fixed Mines key
        # [build-38.6] minSdk 26 makes AGP drop the v1 (JAR) scheme; re-sign the aligned APK with apksigner so it carries
        # v1 + v2 + v3, same key and certificate.
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          for f in out/*.apk; do
            "$BT/apksigner" sign --ks hark-build/mines-debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey \
              --min-sdk-version 21 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true "$f"
          done

      - name: Verify package and signing certificate
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          for f in out/*.apk; do
            pkg=$("$BT/aapt2" dump badging "$f" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            cert=$("$BT/apksigner" verify --print-certs "$f" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
            echo "$f package=$pkg cert=$cert"
            [ "$pkg" = "$MINES_PACKAGE" ] || { echo "::error::wrong package $pkg"; exit 1; }
            [ "$cert" = "$MINES_CERT_SHA256" ] || { echo "::error::APK not signed with the fixed Mines key ($cert)"; exit 1; }
            # [38.8 / 38.7.1] minSdk 26: Android only checks v2/v3 (apksigner without --min-sdk-version reports v1 false even
            # when the JAR signature is there). Require v2 + v3; v1 is reported for information only.
            "$BT/apksigner" verify -v "$f" | tee /tmp/sigv.txt
            for v in 2 3; do grep -q "Verified using v$v scheme (.*): true" /tmp/sigv.txt || { echo "::error::APK lacks the v$v signature"; exit 1; }; done
            "$BT/apksigner" verify -v --min-sdk-version 21 "$f" 2>/dev/null | grep "v1 scheme" || true
          done
          mv out/app-release.apk out/mines-${MINES_BUILD_LABEL}.apk 2>/dev/null || true
          ls -la out

      - name: Unit tests (38.8 presets + 邮箱 IMAP reader + screen tiers + 脑图 layout + 38.9 经验 + keychain + 38.9.1 identity / session / address / mail config + 38.9.2 feed refresh; blocks the build)
        timeout-minutes: 25
        run: |
          cd om/src/android
          ./gradlew --no-daemon :app:testReleaseUnitTest --tests 'com.openminis.app.plus.group.PresetRegistryTest' --tests 'com.openminis.app.plus.MailImapTest' --tests 'com.openminis.app.sandbox.offload.ScreenTiersTest' --tests 'com.openminis.app.ui.plus.KnowledgeLayoutTest' --tests 'com.openminis.app.agent.ExperienceCoreTest' --tests 'com.openminis.app.plus.KeychainCoreTest' --tests 'com.openminis.app.plus.IdentityCoreTest' --tests 'com.openminis.app.plus.SessionStatusTest' --tests 'com.openminis.app.plus.AddressFixTest' --tests 'com.openminis.app.plus.MailConfigTest' --tests 'com.openminis.app.plus.FeedRefreshTest' --tests 'com.openminis.app.plus.SkillHubCnTest' --tests 'com.openminis.app.plus.ConnDedupeTest' --tests 'com.openminis.app.plus.A11yCheckTest' --tests 'com.openminis.app.provider.openai.ThinkingParamFallbackTest' --tests 'com.openminis.app.plus.GlassAutoTest' --tests 'com.openminis.app.plus.TaskProgressCoreTest' --tests 'com.openminis.app.plus.AccountsCoreTest' --tests 'com.openminis.app.plus.WorkspaceCoreTest' --tests 'com.openminis.app.plus.CodeSourcesCoreTest' --tests 'com.openminis.app.plus.RouteStatusCoreTest' --tests 'com.openminis.app.plus.SkillInstallKeyTest' --tests 'com.openminis.app.plus.WebSessionCoreTest' --tests 'com.openminis.app.plus.ValueChipsTest' --tests 'com.openminis.app.plus.HomeWeatherCoreTest' --tests 'com.openminis.app.plus.LoginMemoryCoreTest' --tests 'com.openminis.app.plus.ArchiveCoreTest' --tests 'com.openminis.app.plus.TaskProgressAutoTest' --tests 'com.openminis.app.plus.GlassWrapperScanTest' --tests 'com.openminis.app.plus.GlassSurfaceScanTest' --tests 'com.openminis.app.plus.LoginValueCoreTest' --tests 'com.openminis.app.plus.SplitProxyCoreTest' --tests 'com.openminis.app.plus.WeatherSkyCoreTest' --tests 'com.openminis.app.plus.ClashConfigCoreTest' --tests 'com.openminis.app.plus.GlassBlurCheckTest' --tests 'com.openminis.app.plus.ReachCoreTest' --tests 'com.openminis.app.plus.ImageOnDemandCoreTest' --tests 'com.openminis.app.plus.ToolArgsCoreTest' --tests 'com.openminis.app.plus.SkillFirstTest' --tests 'com.openminis.app.plus.MarketGitCoreTest' --tests 'com.openminis.app.plus.BrowserHandoffCoreTest' --tests 'com.openminis.app.plus.IncognitoCoreTest' --tests 'com.openminis.app.plus.EngineerModeTest' --tests 'com.openminis.app.plus.HomeFixCoreTest' --tests 'com.openminis.app.plus.MemohKeyCoreTest' --tests 'com.openminis.app.plus.SelfMapCoreTest' --tests 'com.openminis.app.plus.SkillMatchCoreTest' --tests 'com.openminis.app.plus.WorkflowLogCoreTest' --tests 'com.openminis.app.plus.ClashSubCoreTest' --tests 'com.openminis.app.plus.FreeRouteCoreTest' --tests 'com.openminis.app.plus.SwipeRevealCoreTest' --tests 'com.openminis.app.plus.CompatQuirksTest' --tests 'com.openminis.app.plus.ConnRetryTest' --tests 'com.openminis.app.plus.BuiltinPromptsTest' --tests 'com.openminis.app.plus.ModelScoreCoreTest' --tests 'com.openminis.app.plus.WebUaCoreTest' 2>&1 | tail -60
          exit ${PIPESTATUS[0]}

      - uses: actions/upload-artifact@v4
        with:
          # Mines — continued development of OpenMinis (https://github.com/OpenMinis/OpenMinis)
          name: mines-apk
          path: out/*.apk
          retention-days: 14

      - name: Publish as a release
        # Only commits marked [release] (or a manual run) publish; other pushes
        # are compile checks and keep their APK as the run artifact.
        # build-i: never publishes from this branch (user: no release until screenshots are checked)
        if: github.ref_name == 'hark-minis-build' && (contains(github.event.head_commit.message, '[release]') || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${MINES_BUILD_LABEL}"
          gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" out/*.apk --repo "${{ github.repository }}" --title "Mines build ${MINES_BUILD_NUMBER}" --notes "Mines — continued development of OpenMinis (https://github.com/OpenMinis/OpenMinis). Upstream commit b4c0661 + Mines patches. GPL-3.0; original OpenMinis LICENSE and copyright notices retained. Package $MINES_PACKAGE, signed with the fixed Mines key (cert SHA-256 $MINES_CERT_SHA256), so later builds install in place." --prerelease
