name: VPS screen smoke test (emulator)

# Runs when hark-build/smoke/ changes (workflow_dispatch needs the file on the
# default branch). hark-build/smoke/target says what to test:
#   line 1: release tag (build-27) or run:<actions run id> (its mines-apk artifact)
on:
  push:
    branches: [hark-minis-build, hark-group]
    paths: ['hark-build/smoke/**', '.github/workflows/vps-smoke.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [34]
    steps:
      - uses: actions/checkout@v4
      - name: Get APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p apk
          t=$(head -1 hark-build/smoke/target | tr -d ' \r')
          case "$t" in
            run:*) gh run download "${t#run:}" --repo "${{ github.repository }}" -n mines-apk -D apk ;;
            *) gh release download "$t" --repo "${{ github.repository }}" -p '*.apk' -D apk ;;
          esac
          ls -la apk
          echo "APK=$(ls apk/*.apk | head -1)" >> "$GITHUB_ENV"
      - name: Local sshd for the app to log in to (10.0.2.2:22 from the emulator)
        run: |
          sudo apt-get install -y -qq openssh-server >/dev/null
          echo 'root:MinesSmoke-2026' | sudo chpasswd
          printf 'PermitRootLogin yes\nPasswordAuthentication yes\nKbdInteractiveAuthentication yes\nPubkeyAuthentication yes\n' | sudo tee /etc/ssh/sshd_config.d/99-smoke.conf
          sudo systemctl restart ssh || sudo service ssh restart
          ssh-keyscan -T 5 127.0.0.1 | head -2
          nohup python3 hark-build/smoke/fake_openai.py > fake-openai.log 2>&1 &
          sleep 1; curl -s http://127.0.0.1:8088/v1/models
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulator + UI drive
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash hark-build/smoke/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vps-smoke-out-${{ matrix.api }}
          path: smoke-out
